</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <main class="page">
    <article class="card">
      <div class="cover-wrap">
        <img
          class="cover"
          src="cover-wylmb.jpg"
          width="1200"
          height="1200"
          alt="Will You Leave Me Bleeding cover artwork"
          fetchpriority="high"
        >
      </div>

      <div class="info">
        <p class="artist">Andy Roze</p>
        <h1>Will You Leave Me Bleeding</h1>
        <p class="subtitle">Choose your preferred music service</p>

        <div class="service-list" id="service-list" aria-label="Music services"></div>
        <div class="no-links" id="no-links">
          Add your service URLs in <strong>links.js</strong>. Buttons appear automatically.
        </div>
        <div class="social-row">
          <span class="follow-label">Follow on:</span>
          <a class="social-spotify" id="follow-button" href="#" aria-label="Follow on Spotify">
            <span class="spotify-mini-icon" aria-hidden="true"></span>
          </a>
        </div>

        <footer class="footer">
          <span>© 2026 AZ Studio Records</span>
          <span class="footer-dot" aria-hidden="true"></span>
          <button class="share-link" id="share" type="button" aria-label="Share this page">
            <span class="share-icon" aria-hidden="true"></span>
            <span>Share</span>
          </button>
        </footer>
      </div>
    </article>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Link copied</div>

  <script src="links.js"></script>
  <script>
    const icons = {
      spotify: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2Zm4.58 14.4a.75.75 0 0 1-1.03.25c-2.83-1.73-6.39-2.12-10.58-1.16a.75.75 0 1 1-.34-1.46c4.59-1.05 8.53-.6 11.7 1.34a.75.75 0 0 1 .25 1.03Zm1.47-3.01a.94.94 0 0 1-1.29.31c-3.24-1.99-8.18-2.57-12.01-1.41a.94.94 0 1 1-.54-1.8c4.38-1.33 9.83-.68 13.53 1.59a.94.94 0 0 1 .31 1.31Zm.13-3.13C14.3 7.95 7.89 7.73 4.18 8.85a1.12 1.12 0 1 1-.65-2.14c4.26-1.29 11.34-1.03 15.8 1.62a1.12 1.12 0 0 1-1.15 1.93Z"/></svg>`,
      apple: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.7 13.06c.03 3.18 2.79 4.24 2.82 4.26-.02.08-.44 1.52-1.45 3-.87 1.29-1.78 2.58-3.2 2.61-1.39.03-1.84-.83-3.44-.83-1.6 0-2.1.8-3.42.86-1.37.05-2.42-1.39-3.3-2.68-1.8-2.61-3.18-7.37-1.33-10.58A5.14 5.14 0 0 1 9.75 7.1c1.36-.03 2.64.92 3.44.92.8 0 2.31-1.14 3.9-.97.66.03 2.52.27 3.71 2.01-.1.06-2.22 1.3-2.1 4Zm-2.65-7.69c.73-.88 1.22-2.1 1.09-3.32-1.05.04-2.32.7-3.08 1.58-.68.78-1.28 2.02-1.12 3.21 1.17.09 2.37-.59 3.11-1.47Z"/></svg>`,
      "youtube-music": `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10 8.8 5.1 3.2-5.1 3.2Z"/></svg>`,
      youtube: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12s0-3.1-.4-4.6a2.8 2.8 0 0 0-2-2C18.1 5 12 5 12 5s-6.1 0-7.6.4a2.8 2.8 0 0 0-2 2C2 8.9 2 12 2 12s0 3.1.4 4.6a2.8 2.8 0 0 0 2 2C5.9 19 12 19 12 19s6.1 0 7.6-.4a2.8 2.8 0 0 0 2-2C22 15.1 22 12 22 12Zm-12 3.5v-7l6 3.5Z"/></svg>`,
      amazon: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 16.7c-.8.6-1.9.9-2.8.9-1.4 0-2.7-.5-3.7-1.4-.1-.1 0-.3.1-.2 1.1.6 2.4 1 3.8 1 .8 0 1.7-.2 2.5-.5.2-.1.3.1.1.2Zm.8-.5c-.1-.2-.7-.1-1 0-.1 0-.1-.1 0-.2.8-.6 2.2-.4 2.4-.2.2.2-.1 1.6-.8 2.2-.1.1-.2 0-.2-.1.2-.3.7-1.5.6-1.7ZM15.7 8.8c0-.7.1-1.3-.5-1.8-.4-.4-1.1-.5-1.6-.5-1.1 0-2.3.4-2.6 1.7 0 .1.1.2.2.2l1.7.2c.2 0 .3-.2.3-.3.1-.4.4-.6.8-.6.2 0 .5.1.6.3.2.2.2.6.2.9v.2c-.7.1-1.7.1-2.5.4-.9.4-1.6 1.1-1.6 2.3 0 1.4.9 2.1 2 2.1.9 0 1.5-.2 2.3-1 .3.4.4.6.9 1 .1.1.3.1.4 0l1.3-1.1c.1-.1.1-.3 0-.4-.3-.4-.6-.7-.6-1.5V8.8h-1.3Zm-.9 2.3c0 .5 0 .9-.2 1.3-.2.4-.6.7-1 .7-.6 0-.9-.4-.9-1.1 0-1.3 1.2-1.6 2.2-1.6v.7Z"/></svg>`,
      deezer: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h4v2H3Zm0-3h4v2H3Zm5 3h4v2H8Zm0-6h4v2H8Zm0 3h4v2H8Zm5 3h4v2h-4Zm0-9h4v2h-4Zm0 3h4v2h-4Zm0 3h4v2h-4Zm5 3h3v2h-3Zm0-6h3v2h-3Zm0 3h3v2h-3Z"/></svg>`,
      tidal: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7.5 5 3 3-3 3-3-3Zm9 0 3 3-3 3-3-3ZM12 9.5l3 3-3 3-3-3Zm-4.5 4.5 3 3-3 3-3-3Zm9 0 3 3-3 3-3-3Z"/></svg>`,
      soundcloud: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 13.2c-.1 0-.2.1-.2.2L1.2 16l.4 2.5c0 .1.1.2.2.2s.2-.1.2-.2l.5-2.5-.5-2.6c0-.1-.1-.2-.2-.2Zm2-.9c-.1 0-.2.1-.2.2L3 16l.6 3.4c0 .1.1.2.2.2s.2-.1.2-.2l.7-3.4-.7-3.5c0-.1-.1-.2-.2-.2Zm2.1-1.5c-.2 0-.3.1-.3.3L5 16l.6 4.6c0 .2.1.3.3.3s.3-.1.3-.3l.7-4.6-.7-4.9c0-.2-.1-.3-.3-.3Zm9.7.8a4.1 4.1 0 0 0-1.7.4 5.5 5.5 0 0 0-10.8 1.3c0 .3.1 6.8.1 7 0 .2.2.4.4.4h12a4.6 4.6 0 1 0 0-9.1Z"/></svg>`,
      bandcamp: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.1 6h15.4l-3.6 12H2.5Z"/></svg>`
    };

    const list = document.getElementById("service-list");
    const noLinks = document.getElementById("no-links");
    const links = Array.isArray(window.SMART_LINKS) ? window.SMART_LINKS : [];
    const meta = window.SMART_LINK_META || {};
    const visibleLinks = links.filter(item => item && item.name);

    function validUrl(value) {
      try {
        const url = new URL(value, window.location.href);
        return ["http:", "https:", "spotify:", "music:", "itmss:", "youtube:", "youtubemusic:"].includes(url.protocol);
      } catch {
        return false;
      }
    }

    function openDeepLink(item, event) {
      const webUrl = item.url.trim();
      const appUrl = typeof item.appUrl === "string" ? item.appUrl.trim() : "";

      if (!appUrl || !validUrl(appUrl)) return;

      event.preventDefault();
      let fallbackTimer;

      const cancelFallback = () => {
        if (document.hidden && fallbackTimer) window.clearTimeout(fallbackTimer);
      };

      document.addEventListener("visibilitychange", cancelFallback, { once: true });
      window.location.href = appUrl;

      fallbackTimer = window.setTimeout(() => {
        if (!document.hidden) window.location.href = webUrl;
      }, 1100);
    }

    visibleLinks.forEach(item => {
      const anchor = document.createElement("a");
      const hasUrl = typeof item.url === "string" && item.url.trim();
      anchor.className = `service-link${hasUrl ? "" : " is-placeholder"}`;
      anchor.href = hasUrl ? item.url.trim() : "#";
      anchor.setAttribute("aria-label", `${item.name}: ${item.action || "Open"}`);
      anchor.innerHTML = `
        <span class="service-icon" data-service="${item.service || ""}">${icons[item.service] || icons.youtube}</span>
        <span class="service-name">${item.name || "Music service"}</span>
        <span class="service-action">${item.action || "Open"}</span>
      `;
      anchor.addEventListener("click", event => {
        if (!hasUrl) {
          event.preventDefault();
          showToast("Add this link in links.js");
          return;
        }
        openDeepLink(item, event);
      });
      list.appendChild(anchor);
    });

    if (!visibleLinks.length) {
      noLinks.style.display = "block";
    }

    const followButton = document.getElementById("follow-button");
    const followUrl = typeof meta.followUrl === "string" ? meta.followUrl.trim() : "";
    if (followUrl && validUrl(followUrl)) {
      followButton.href = followUrl;
    } else {
      followButton.href = "#";
      followButton.classList.add("is-placeholder");
      followButton.addEventListener("click", event => {
        event.preventDefault();
        showToast("Add followUrl in links.js");
      });
    }

    const shareButton = document.getElementById("share");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
    }

    shareButton.addEventListener("click", async () => {
      const data = {
        title: document.title,
        text: "Andy Roze — Will You Leave Me Bleeding",
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(data);
          return;
        }
        await navigator.clipboard.writeText(window.location.href);
        showToast("Link copied");
      } catch (error) {
        if (error && error.name !== "AbortError") showToast("Copy the page URL");
      }
    });
  </script>
</body>
</html>
